name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the release job attaches installers to a GitHub release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # install-action has no prebuilt cargo-packager and its cargo-binstall
      # fallback breaks on the current macOS runner image, so build it once;
      # rust-cache keeps ~/.cargo/bin for later runs.
      - name: Install cargo-packager
        shell: bash
        run: |
          if ! cargo packager --version 2>/dev/null | grep -q '0\.11\.8'; then
            cargo install cargo-packager --version 0.11.8 --locked
          fi
          cargo packager --version
      # Static sherpa-onnx + ONNX Runtime for the transcriber (no TTS, no
      # GPL code). Built once per script change, then restored from cache.
      - name: Cache sherpa-onnx
        uses: actions/cache@v4
        with:
          path: .deps/sherpa-onnx-1.13.8
          key: sherpa-onnx-1.13.8-${{ matrix.name }}-${{ hashFiles('scripts/build-sherpa-onnx.sh') }}
      - name: Build sherpa-onnx
        shell: bash
        run: scripts/build-sherpa-onnx.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --release -- -D warnings
      # Tests that need the 640 MB speech model are #[ignore]d; run them
      # locally (see crates/recorder-transcriber/tests/model.rs).
      - name: Tests
        run: cargo test --workspace --release
      - name: Build
        run: cargo build --release -p recorder-cli -p recorder-tray -p recorder-transcriber
      - name: DLL dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          & $dumpbin.FullName /dependents target\release\recorder.exe
          & $dumpbin.FullName /dependents target\release\meeting-recorder.exe
          & $dumpbin.FullName /dependents target\release\meeting-recorder-transcribe.exe
      - name: Transcriber starts
        shell: bash
        run: |
          f=target/release/meeting-recorder-transcribe
          [ -f "$f.exe" ] && f="$f.exe"
          "$f" --version
      - name: Package
        shell: bash
        env:
          # Optional repository secrets. Without them the macOS app gets an
          # ad-hoc signature and the Windows installer is unsigned.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # cargo-packager treats an empty variable as "set", so drop empty ones.
          for v in APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            sed -i.bak "s|^signing-identity = \"-\"|signing-identity = \"$APPLE_SIGNING_IDENTITY\"|" crates/recorder-tray/Cargo.toml
          fi
          cd crates/recorder-tray && cargo packager --release
      # The transcriber with ONNX Runtime adds about 8 MB compressed; the
      # speech model (640 MB) is downloaded by the app, not shipped.
      - name: Installer size (limit 25 MB)
        shell: bash
        run: |
          ls -la dist
          for f in dist/*.dmg dist/*-setup.exe; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            echo "$f: $size bytes"
            [ "$size" -le 26214400 ] || { echo "::error::$f is larger than 25 MB"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: meeting-recorder-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*-setup.exe
            target/release/recorder
            target/release/recorder.exe
            target/release/meeting-recorder-transcribe
            target/release/meeting-recorder-transcribe.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/dist/*.dmg
            artifacts/dist/*-setup.exe
