[package]
name = "recorder-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
recorder-core.workspace = true
recorder-capture.workspace = true
recorder-transcribe.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs = "7"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
os_info = { version = "3.15", default-features = false }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2.5"
# Deleting recordings and transcripts moves them to the Trash / Recycle Bin.
trash = "5.3"
# Importing audio and video files (MPL-2.0; see THIRD_PARTY_NOTICES.md).
symphonia = { version = "0.6.1", default-features = false, features = ["opt-simd", "mp3", "aac", "alac", "flac", "pcm", "adpcm", "vorbis", "isomp4", "wav", "aiff", "caf", "ogg", "mkv", "id3v2", "id3v1", "ape"] }
rubato = { version = "5.0.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[dev-dependencies]
uuid = { version = "1.29", features = ["v4"] }
