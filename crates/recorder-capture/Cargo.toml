[package]
name = "recorder-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cpal = "0.18.2"
ringbuf = "0.5.3"
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
wasapi = "0.26.0"
windows = { version = "0.62.2", features = ["Win32_System_Performance", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Power"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSDictionary", "NSString", "NSUUID", "NSValue", "NSError", "NSObject"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFDictionary", "CFString", "CFBase"] }
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-media = { version = "0.3.2", features = ["CMSampleBuffer", "CMTime", "CMBlockBuffer", "CMFormatDescription", "objc2-core-audio-types"] }
objc2-screen-capture-kit = { version = "0.3.2", features = ["SCStream", "SCShareableContent", "block2", "objc2-core-media", "dispatch2"] }
