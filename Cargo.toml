[workspace]
resolver = "3"
members = [
  "crates/recorder-core",
  "crates/recorder-capture",
  "crates/recorder-app",
  "crates/recorder-cli",
  "crates/recorder-tray",
  "crates/recorder-transcribe",
  "crates/recorder-transcriber",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
recorder-core = { path = "crates/recorder-core" }
recorder-capture = { path = "crates/recorder-capture" }
recorder-app = { path = "crates/recorder-app" }
recorder-transcribe = { path = "crates/recorder-transcribe" }
anyhow = "1"
thiserror = "2"
tracing = "0.1.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Thin LTO and parallel code generation: the heavy work runs in the C++
# libraries (ONNX Runtime, whisper.cpp), which Rust's LTO does not touch,
# while fat LTO with one code unit made every release link (each test
# binary too) take minutes of full CPU.
[profile.release]
opt-level = 3
lto = "thin"
panic = "unwind"
strip = true
