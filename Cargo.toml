[workspace]
resolver = "3"
members = ["crates/recorder-core", "crates/recorder-capture", "crates/recorder-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
recorder-core = { path = "crates/recorder-core" }
recorder-capture = { path = "crates/recorder-capture" }
anyhow = "1"
thiserror = "2"
tracing = "0.1.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
